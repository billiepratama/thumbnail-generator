# Default values for thumbnail-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

api:
  replicaCount: 1
  image: "thumbnail-api:latest" # Local image tag
  imagePullPolicy: IfNotPresent # Use IfNotPresent for local kind clusters
  port: 8000
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

worker:
  replicaCount: 1
  image: "thumbnail-worker:latest" # Local image tag
  imagePullPolicy: IfNotPresent # Use IfNotPresent for local kind clusters
  resources:
    requests:
      cpu: "150m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

redis:
  image: "redis:7-alpine"
  imagePullPolicy: IfNotPresent
  port: 6379
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  # Redis is deployed as a StatefulSet to ensure stable network IDs and persistent storage
  # For local testing, we use a single replica
  replicaCount: 1

storage:
  size: 1Gi # Size of the PersistentVolumeClaim
  storageClassName: "" # Use default or specific storage class (e.g., "standard" in kind)
  mountPath: /app/storage # Path inside the containers where the PVC will be mounted

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
