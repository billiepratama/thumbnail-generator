apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thumbnail-api-release-storage
  labels:
    helm.sh/chart: thumbnail-api
    app.kubernetes.io/name: thumbnail-api
    app.kubernetes.io/instance: thumbnail-release
    app.kubernetes.io/managed-by: Helm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi