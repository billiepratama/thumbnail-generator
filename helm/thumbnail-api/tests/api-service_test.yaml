suite: test api service
templates:
  - api-service.yaml
release:
  name: test
values:
  - ../test-values.yaml
tests:
  - it: should be a Service
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: test-api
  - it: should be a NodePort service
    asserts:
      - equal:
          path: spec.type
          value: NodePort
  - it: should have the correct port and target port
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8000
      - equal:
          path: spec.ports[0].targetPort
          value: 8000
